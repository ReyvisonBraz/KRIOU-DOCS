[functions.mercadopago-webhook]
verify_jwt = false

# A funcao faz a autenticacao internamente com supabase.auth.getUser(token).
# Desativar a validacao duplicada do gateway evita falsos 401 por clock skew
# sem tornar a verificacao publica: requisicoes sem usuario continuam rejeitadas.
[functions.verify-payment]
verify_jwt = false

# admin-metrics usa o mesmo padrao: autenticacao e capacidade privada validadas
# internamente. Evita falsos 401 por clock skew;
# requisicoes sem usuario valido continuam recebendo 401/403 na funcao.
[functions.admin-metrics]
verify_jwt = false

[functions.admin]
verify_jwt = false
